# Every update goes live by itself:
#  1. apps-script — if src/ changed (or run by hand): checks + Master Key test,
#     safety check against the live project, then the SAME /exec deployment
#     is updated (tools/deploy.mjs stops and changes nothing if unsafe).
#  2. website    — builds site/ (public GitHub Pages app) and publishes it.
# Needs 2 repository secrets: CLASPRC_JSON (Google sign-in from
# "npx @google/clasp@2.4.2 login") and MVL_MASTER_KEY (the Master Key).
name: deploy
on:
  push:
    branches: [main]
    paths: ['src/**', 'web/**', 'tools/**', 'package.json', 'package-lock.json', '.github/workflows/deploy.yml']
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  apps-script:
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.need.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Secrets present? src/ changed?
        id: need
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          MVL_MASTER_KEY: ${{ secrets.MVL_MASTER_KEY }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$MVL_MASTER_KEY" ]; then
            echo "::error::Add the CLASPRC_JSON and MVL_MASTER_KEY secrets to turn auto-deploy on."; exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet HEAD~1 HEAD -- src/; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "::notice::src/ unchanged — Apps Script not redeployed."
          fi
      - uses: actions/setup-node@v4
        if: steps.need.outputs.run == 'true'
        with:
          node-version: 20
      - name: Install
        if: steps.need.outputs.run == 'true'
        run: npm ci --no-audit --no-fund
      - name: Google sign-in + unlock with the Master Key
        if: steps.need.outputs.run == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          MVL_MASTER_KEY: ${{ secrets.MVL_MASTER_KEY }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node tools/unlock.mjs
      - name: Check, safety check, push, deploy
        if: steps.need.outputs.run == 'true'
        env:
          NOTE: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: node tools/deploy.mjs "$NOTE"
      - name: Clean up sign-in
        if: always()
        run: rm -f "$HOME/.clasprc.json" .clasp.json .local/secrets.json

  website:
    needs: apps-script
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unlock the /exec link + build the website
        env:
          MVL_MASTER_KEY: ${{ secrets.MVL_MASTER_KEY }}
        run: |
          node tools/unlock.mjs
          node tools/build-site.mjs
          rm -f .clasp.json .local/secrets.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v4
